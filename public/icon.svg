<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Clipboard Outer Plate -->
  <rect x="116" y="116" width="280" height="310" rx="36" fill="#ffffff" filter="url(#shadow)" />

  <!-- Clipboard Top Clip -->
  <rect x="186" y="86" width="140" height="56" rx="18" fill="#1e1b4b" />
  <rect x="226" y="104" width="60" height="20" rx="10" fill="#e0e7ff" />

  <!-- Checkmark Badge -->
  <circle cx="340" cy="370" r="54" fill="url(#glowGrad)" filter="url(#shadow)" />
  <path d="M320 370 L334 384 L362 356" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Data Lines inside Clipboard -->
  <rect x="160" y="180" width="130" height="16" rx="8" fill="#4f46e5" />
  <rect x="160" y="216" width="190" height="12" rx="6" fill="#cbd5e1" />
  <rect x="160" y="244" width="160" height="12" rx="6" fill="#e2e8f0" />
  <rect x="160" y="272" width="140" height="12" rx="6" fill="#e2e8f0" />

  <!-- Fiber / Signal pulse dots -->
  <circle cx="168" cy="330" r="8" fill="#38bdf8" />
  <circle cx="196" cy="330" r="8" fill="#818cf8" />
  <circle cx="224" cy="330" r="8" fill="#c084fc" />
</svg>
